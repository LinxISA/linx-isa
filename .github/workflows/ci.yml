name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Initialize canonical QEMU leaf
        run: git submodule update --init emulator/qemu
      - name: Initialize PTO ASL functional-model chain
        run: |
          git submodule update --init tools/pto-spec
          git submodule update --init tools/asl-model
          git submodule update --init tools/SuperScalarModel
          git -C tools/pto-spec fetch --no-tags origin \
            a0d7b39c345f19e90020d356dd8caf4d83e03418
      - name: Enforce Draft staging or merge-ready component pins
        env:
          REQUIRE_MERGE_READY: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
        run: |
          args=()
          if [[ "$REQUIRE_MERGE_READY" == "true" ]]; then
            args+=(--require-merge-ready)
          fi
          python3 tools/ci/check_component_lock.py --root . "${args[@]}"
      - name: Check exact PTO source projection parity
        run: python3 tools/isa/import_pto_v0580.py --source-root tools/pto-spec --check
      - name: Check v0.58 golden artifacts
        run: python3 tools/isa/build_golden.py --profile v0.58 --check
      - name: Validate standalone v0.58 ISA spec
        run: |
          python3 tools/isa/validate_spec.py --profile v0.58
          python3 tools/isa/test_v058_profile.py
          python3 tools/isa/check_pto_v058_manifest.py --root .
          python3 tools/isa/check_pto_profile_hooks.py --root .
          python3 -m unittest tools.isa.test_pto_profile_hooks
          python3 tools/isa/check_pto_functional_model_lock.py --root .
          python3 -m unittest tools.isa.test_pto_functional_model_lock
          python3 tools/isa/test_golden_contract.py
          python3 tools/isa/test_fused_call_contract.py
          python3 tools/isa/test_agent_navigation.py
          python3 tools/isa/test_b_datr_documentation.py
          python3 tools/isa/test_b_ios_documentation.py
          python3 tools/isa/test_documentation_includes.py
          python3 tools/isa/check_agent_navigation.py --root .
          python3 tools/isa/report_encoding_space.py --check
          python3 tools/isa/gen_qemu_codec.py --check
          python3 tools/isa/gen_c_codec.py --check
          python3 tools/isa/gen_sail_decode.py --check
          python3 tools/isa/gen_sail_status.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            emulator.qemu.tests.linxisa.test_v0583_contract \
            emulator.qemu.tests.linxisa.test_v058_hardware_numeric_vectors
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            emulator.qemu.tests.linxisa.test_first_use_exception
      - name: Enforce canonical v0.58 release guard
        run: python3 tools/isa/check_canonical_v058.py --root .
      - name: Validate branch cleanup evidence schema
        run: python3 tools/bringup/check_branch_cleanup_manifest.py --manifest docs/bringup/branch_cleanup_manifest.json --mode static
      - name: Enforce canonical QEMU opcode metadata
        run: python3 tools/bringup/check_qemu_opcode_meta_sync.py --strict
      - name: Cross-check QEMU v0.58 TEPL carrier selectors
        run: python3 tools/bringup/check_tepl_encoding.py --root .
      - name: Enforce Repository Layout
        run: bash tools/ci/check_repo_layout.sh

  avs-contract:
    runs-on: ubuntu-latest
    env:
      OPAMROOT: ${{ github.workspace }}/.ci-opam
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-xdg-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.3"
      - name: Init top-level LinxISA submodules
        run: |
          git submodule sync -- tools/Linx-TileOP-API
          git submodule update --init tools/Linx-TileOP-API
          git submodule sync -- workloads/pto_kernels
          git submodule update --init workloads/pto_kernels
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Install Sail system dependencies
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Install pinned Sail toolchain
        run: opam install --yes sail.0.20.2
      - name: Run AVS contract gate
        run: python3 tools/bringup/check_avs_contract.py --matrix avs/linx_avs_v1_test_matrix.yaml
      - name: Validate Linx-TileOP-API v0.58 surface
        run: make -C tools/Linx-TileOP-API check
      - name: Cross-check TileOP v0.58 VEC/SFU aliases
        run: python3 tools/bringup/check_tepl_encoding.py --root .
      - name: Validate nested SuperNPU v0.58 corpus
        run: python3 workloads/pto_kernels/scripts/check_supernpu_v058.py
      - name: Test shared freestanding math services
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fno-builtin \
            -Iavs/runtime/freestanding/include \
            avs/runtime/freestanding/src/math/math.c \
            avs/runtime/freestanding/tests/math_test.c \
            -o "${RUNNER_TEMP}/linx-freestanding-math-test"
          "${RUNNER_TEMP}/linx-freestanding-math-test"
      - name: Run Sail model gate
        run: |
          eval "$(opam env)"
          python3 tools/bringup/check_sail_model.py --require-parser --require-c-backend
          python3 tools/isa/sail_coverage.py --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip "mkdocs<2" mkdocs-material
          bundle install
        working-directory: docs/architecture/isa-manual
      - name: Check documentation projections
        run: python3 docs/check_documentation.py --root .
      - name: Build normative English documentation
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/site-en"
      - name: Build secondary Chinese documentation
        run: mkdocs build --strict --config-file mkdocs.zh.yml --site-dir "${RUNNER_TEMP}/site-zh"
      - name: Render the ISA manual strictly
        run: bundle exec asciidoctor --failure-level WARN -o "${RUNNER_TEMP}/linxisa-isa-manual.html" src/linxisa-isa-manual.adoc
        working-directory: docs/architecture/isa-manual

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install python lint deps
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (hard errors only)
        run: ruff check --config ruff.toml --force-exclude .
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        shell: bash
        run: |
          shopt -s nullglob
          mapfile -t files < <(git ls-files '*.sh')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck -x -S error "${files[@]}"

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Init tools/model submodule
        run: |
          git submodule sync -- tools/model
          git submodule update --init tools/model
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure tools/model
        run: cmake -S tools/model -B tools/model/build-ci -G Ninja
      - name: Build tools/model
        run: cmake --build tools/model/build-ci
      - name: Run tools/model tests
        run: ctest --test-dir tools/model/build-ci --output-on-failure

  functional-model:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Initialize exact functional-model components
        run: |
          git submodule update --init tools/pto-spec
          git submodule update --init tools/asl-model
          git submodule update --init tools/SuperScalarModel
      - name: Checkout exact functional-model corpus producer
        uses: actions/checkout@v7
        with:
          repository: PTO-ISA/pto-spec
          ref: a0d7b39c345f19e90020d356dd8caf4d83e03418
          path: .ci/pto-corpus
      - name: Validate exact pins and PTO projection parity
        run: |
          git -C tools/pto-spec fetch --no-tags origin \
            a0d7b39c345f19e90020d356dd8caf4d83e03418
          python3 tools/isa/check_pto_functional_model_lock.py --root .
          python3 tools/isa/import_pto_v0580.py --source-root tools/pto-spec --check
      - name: Build PTO ASL and install the public model ABI
        run: |
          make -C tools/pto-spec build
          cmake -S tools/asl-model -B .ci/asl-model-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/.ci/asl-model-install"
          cmake --build .ci/asl-model-build -j 12
          cmake --install .ci/asl-model-build
      - name: Verify exact hosted LLVM toolchain and build corpus
        env:
          PTO_FUNCTIONAL_TOOLCHAIN_BIN: ${{ vars.PTO_FUNCTIONAL_TOOLCHAIN_BIN }}
        run: |
          toolchain_bin="${PTO_FUNCTIONAL_TOOLCHAIN_BIN:-${GITHUB_WORKSPACE}/compiler/llvm/build-linxisa-clang/bin}"
          test -x "$toolchain_bin/clang"
          test -x "$toolchain_bin/ld.lld"
          test -x "$toolchain_bin/llvm-readelf"
          test "$(git -C "$toolchain_bin" rev-parse HEAD)" = \
            baef2b3a47a2162ef4e0542eb715562bfdbe7a6a
          test "$(sha256sum "$toolchain_bin/clang" | cut -d' ' -f1)" = \
            f9009511b94b0a7de2275a96f28d53afcaa9b635af7425e8316cee875bddcb8e
          test "$(sha256sum "$toolchain_bin/ld.lld" | cut -d' ' -f1)" = \
            ee909db67b7e7686b7890d8c197738d0411fde889c03adb436d803d53085d8da
          test "$(sha256sum "$toolchain_bin/llvm-readelf" | cut -d' ' -f1)" = \
            8c1d14f4b9a4616a2f477d721eeb65e9d29533d0adf607218e595dd4c5d0aca4
          .ci/pto-corpus/scripts/build-functional-model-corpus \
            --clang "$toolchain_bin/clang" \
            --lld "$toolchain_bin/ld.lld" \
            --readelf "$toolchain_bin/llvm-readelf" \
            --output .ci/pto-corpus-build
          python3 tools/SuperScalarModel/scripts/prepare-asl-gfrun-corpus-index \
            .ci/pto-corpus-build/manifest.json \
            .ci/pto-asl-corpus.index
      - name: Build and execute the three real ASL-only gfrun smoke cases
        run: |
          python3 tools/SuperScalarModel/build.py all --clean --tests \
            --warnings-as-errors \
            --build-dir "${GITHUB_WORKSPACE}/.ci/asl-gfrun-build" \
            --target check-asl-gfrun \
            --pto-asl-model-root "${GITHUB_WORKSPACE}/.ci/asl-model-install" \
            --pto-asl-runner "${GITHUB_WORKSPACE}/tools/asl-model/scripts/pto-asl-run" \
            --pto-asl-spec "${GITHUB_WORKSPACE}/tools/pto-spec/build/pto-spec.asl" \
            --pto-aslref "${GITHUB_WORKSPACE}/tools/pto-spec/.cache/herdtools7/_build/default/asllib/aslref.exe" \
            --pto-asl-lock "${GITHUB_WORKSPACE}/tools/asl-model/pto-lock.json" \
            --pto-asl-corpus-index "${GITHUB_WORKSPACE}/.ci/pto-asl-corpus.index" \
            -j 12
      - name: Validate retained execution manifests and result bytes
        run: |
          python3 tools/isa/check_pto_functional_model_lock.py \
            --root . \
            --corpus-manifest .ci/pto-corpus-build/manifest.json \
            --evidence-root .ci/asl-gfrun-build/asl-gfrun-results
      - name: Retain functional-model execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pto-functional-model-${{ github.sha }}
          if-no-files-found: error
          path: |
            .ci/pto-corpus-build/manifest.json
            .ci/pto-corpus-build/*/manifest.json
            .ci/pto-corpus-build/*/*.elf
            .ci/pto-corpus-build/*/*.golden.bin
            .ci/asl-gfrun-build/asl-gfrun-results/*/manifest.json
            .ci/asl-gfrun-build/asl-gfrun-results/*/result.bin

  guard:
    needs: [guards, avs-contract, docs, lint, model, functional-model]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required release checks
        run: echo "All required LinxISA release checks passed."
