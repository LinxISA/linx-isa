name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Initialize canonical QEMU leaf
        run: git submodule update --init emulator/qemu
      - name: Check v0.58 golden artifacts
        run: python3 tools/isa/build_golden.py --profile v0.58 --check
      - uses: actions/checkout@v7
        with:
          repository: PTO-ISA/pto-spec
          ref: f0a876e449a95d26841c5ee7affb4c905ebc5f5b
          path: workloads/generated/pto-scalar-proposal
      - name: Verify the exact PTO scalar proposal and real QEMU decoder
        run: |
          python3 tools/isa/import_pto_golden.py --source-root workloads/generated/pto-scalar-proposal --check
          python3 tools/isa/check_pto_scalar_proposal.py --pto-root workloads/generated/pto-scalar-proposal
          python3 tools/isa/check_scalar_pcr_contract.py
          python3 -m unittest tools.isa.test_scalar_pcr_contract
          python3 -m unittest tools.isa.test_pto_scalar_proposal tools.isa.test_qemu_scalar_golden
          python3 tools/isa/test_v058_storeop_ext.py
          python3 tools/isa/check_qemu_scalar_golden.py
          python3 avs/qemu/tests/test_atomic_lr_srczero_decode.py
      - uses: actions/checkout@v7
        with:
          repository: PTO-ISA/pto-spec
          ref: 2209562859a89be80b73ea926f5d60b9d018faae
          path: workloads/generated/pto-runtime-startup
      - name: Verify source-bound four-PE startup ABI
        run: |
          python3 tools/isa/pto_runtime_startup.py --source-root workloads/generated/pto-runtime-startup --check
          python3 -m unittest tools.isa.test_pto_runtime_startup
      - name: Validate standalone v0.58 ISA spec
        run: |
          python3 tools/isa/validate_spec.py --profile v0.58
          python3 tools/isa/test_v058_profile.py
          python3 tools/isa/check_pto_v058_manifest.py --root .
          python3 tools/isa/check_pto_profile_hooks.py --root .
          python3 -m unittest tools.isa.test_pto_profile_hooks
          python3 tools/isa/test_golden_contract.py
          python3 tools/isa/test_fused_call_contract.py
          python3 tools/isa/test_agent_navigation.py
          python3 tools/isa/test_b_datr_documentation.py
          python3 tools/isa/test_b_ios_documentation.py
          python3 tools/isa/test_documentation_includes.py
          python3 tools/isa/check_agent_navigation.py --root .
          python3 tools/isa/report_encoding_space.py --check
          python3 tools/isa/gen_qemu_codec.py --check
          python3 tools/isa/gen_c_codec.py --check
          python3 tools/isa/gen_sail_decode.py --check
          python3 tools/isa/gen_sail_scoped_scalar.py --check
          python3 tools/isa/gen_sail_scoped_agu.py --check
          python3 tools/isa/gen_sail_scoped_atomic.py --check
          python3 -m unittest tools.bringup.test_pto_v0591_scalar_reference
          python3 tools/isa/gen_sail_status.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            emulator.qemu.tests.linxisa.test_v0583_contract \
            emulator.qemu.tests.linxisa.test_v058_hardware_numeric_vectors
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            emulator.qemu.tests.linxisa.test_first_use_exception
      - name: Check out released PTO ISA 0.59.1
        uses: actions/checkout@v7
        with:
          repository: PTO-ISA/pto-spec
          ref: refs/tags/v0.59.1.0
          path: workloads/generated/pto-v0591-release
      - name: Verify 0.59.1 reader supplements against the published PTO sources
        run: python3 tools/isa/manual_supplements.py --pto-root workloads/generated/pto-v0591-release
      - name: Verify 0.59.1 HTML manual source projections
        env:
          PTO_SPEC_ROOT: workloads/generated/pto-v0591-release
        run: |
          python3 tools/isa/manual_linx_sail.py --check
          python3 tools/isa/manual_reader.py --pto-root "$PTO_SPEC_ROOT" --check
          python3 tools/isa/build_manual_semantics_zh.py --pto-root "$PTO_SPEC_ROOT" --check
          python3 tools/isa/build_manual_tile_zh.py --pto-root "$PTO_SPEC_ROOT" --check
          python3 tools/isa/build_manual_semantics_reference.py --source "$PTO_SPEC_ROOT" --check
          python3 tools/isa/build_manual_scoped_data.py --pto-root "$PTO_SPEC_ROOT" --out "$RUNNER_TEMP/tile-manual.json"
          cmp docs/architecture/isa-manual/reference/data/pto-v0591-tile-manual.json "$RUNNER_TEMP/tile-manual.json"
      - name: Verify PTO 0.59.1 import and encoding alignment
        run: |
          python3 tools/isa/import_pto_v0591.py --source-root workloads/generated/pto-v0591-release --check
          python3 tools/isa/check_pto_v0591_alignment.py
          python3 tools/isa/build_pto_v0591_candidate.py --check
          python3 -m unittest tools.isa.test_build_linxisa_v0591_candidate
          python3 tools/isa/build_linxisa_v0591_release_prep.py --check
          python3 -m unittest tools.isa.test_build_linxisa_v0591_release_prep
          python3 tools/isa/check_linxisa_v0591_release_compat.py
          python3 -m unittest \
            tools.isa.test_check_linxisa_v0591_release_compat \
            tools.isa.test_build_linxisa_v0591_release_activation
          python3 tools/isa/build_golden.py --profile v0.59 --check
          python3 tools/isa/validate_spec.py --profile v0.59
          python3 tools/isa/report_encoding_space.py \
            --spec isa/v0.59/linxisa-v0.59.json --check
      - name: Verify LinxISA 0.59.2 specification release gates
        run: |
          python3 tools/isa/build_linxisa_v0592_catalog.py --check
          python3 tools/isa/build_linxisa_v0592_release_prep.py --check
          python3 tools/isa/export_linxisa_v0592_sail.py --check-release-package
          python3 tools/isa/build_golden.py --profile v0.59.2 --check
          python3 tools/isa/validate_spec.py --profile v0.59.2
          python3 tools/isa/select_linxisa_profile.py \
            --profile v0.59.2 --require-release-qualified
          python3 -m unittest \
            tools.isa.test_build_linxisa_v0592_catalog \
            tools.isa.test_export_linxisa_v0592_sail \
            tools.isa.test_v0592_profile_entrypoints
      - name: Enforce canonical v0.58 release guard
        run: python3 tools/isa/check_canonical_v058.py --root .
      - name: Validate branch cleanup evidence schema
        run: python3 tools/bringup/check_branch_cleanup_manifest.py --manifest docs/bringup/branch_cleanup_manifest.json --mode static
      - name: Enforce canonical QEMU opcode metadata
        run: python3 tools/bringup/check_qemu_opcode_meta_sync.py --strict
      - name: Cross-check QEMU v0.58 TEPL carrier selectors
        run: python3 tools/bringup/check_tepl_encoding.py --root .
      - name: Enforce Repository Layout
        run: bash tools/ci/check_repo_layout.sh

  avs-contract:
    runs-on: ubuntu-latest
    env:
      OPAMROOT: ${{ github.workspace }}/.ci-opam
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-xdg-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.3"
      - name: Init top-level LinxISA submodules
        run: |
          git submodule sync -- tools/Linx-TileOP-API
          git submodule update --init tools/Linx-TileOP-API
          git submodule sync -- workloads/pto_kernels
          git submodule update --init workloads/pto_kernels
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Install Sail system dependencies
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Install pinned Sail toolchain
        run: opam install --yes sail.0.20.2
      - name: Check assembled v0.59.1 catalog and scoped dispatch with Sail
        run: opam exec -- python3 tools/isa/check_v0591_candidate_dispatch_sail.py
      - name: Check LinxISA 0.59.2 Sail release package
        run: opam exec -- python3 tools/isa/check_v0592_sail.py
      - name: Run AVS contract gate
        run: python3 tools/bringup/check_avs_contract.py --matrix avs/linx_avs_v1_test_matrix.yaml
      - name: Validate Linx-TileOP-API v0.58 surface
        run: make -C tools/Linx-TileOP-API check
      - name: Cross-check TileOP v0.58 VEC/SFU aliases
        run: python3 tools/bringup/check_tepl_encoding.py --root .
      - name: Validate nested SuperNPU v0.58 corpus
        run: python3 workloads/pto_kernels/scripts/check_supernpu_v058.py
      - name: Test shared freestanding math services
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fno-builtin \
            -Iavs/runtime/freestanding/include \
            avs/runtime/freestanding/src/math/math.c \
            avs/runtime/freestanding/tests/math_test.c \
            -o "${RUNNER_TEMP}/linx-freestanding-math-test"
          "${RUNNER_TEMP}/linx-freestanding-math-test"
      - name: Run Sail model gate
        run: |
          eval "$(opam env)"
          python3 tools/bringup/check_sail_model.py --require-parser --require-c-backend
          python3 tools/isa/sail_coverage.py --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install deps
        run: |
          python -m pip install -r reference/requirements.txt
          bundle install
        working-directory: docs/architecture/isa-manual
      - name: Check out the Chinese editing guide used by the manual
        uses: actions/checkout@v7
        with:
          repository: op7418/humanizer-zh
          ref: f4518a8eab97b8bfebc66a89d34320a89bef6930
          path: workloads/generated/humanizer-zh
      - name: Test architecture coverage and protected Chinese prose edits
        env:
          HUMANIZER_ZH_ROOT: workloads/generated/humanizer-zh
        run: |
          python3 -m unittest discover -s tools/isa -p 'test_manual*.py'
          python3 -m unittest discover -s tools/isa -p 'test_check_manual*.py'
      - name: Check documentation projections
        run: python3 docs/check_documentation.py --root .
      - name: Build and audit the tagged instruction reference
        run: |
          python3 tools/isa/gen_html_reference.py --release v0.59.1 --out "$RUNNER_TEMP/linxisa-html"
          python3 tools/isa/check_html_reference.py --site "$RUNNER_TEMP/linxisa-html"
          python3 tools/isa/check_manual_structure.py --site "$RUNNER_TEMP/linxisa-html"
          python3 tools/isa/check_manual_authored.py --site "$RUNNER_TEMP/linxisa-html"
          python3 tools/isa/check_manual_site_quality.py --site "$RUNNER_TEMP/linxisa-html"
      - name: Build and audit the v0.59.2 instruction reference
        run: |
          python3 -m unittest discover -s tools/isa -p 'test_check_v0592_html.py'
          python3 tools/isa/gen_html_reference.py --release v0.59.2 --out "$RUNNER_TEMP/linxisa-html-0592"
          python3 tools/isa/check_v0592_html.py --site "$RUNNER_TEMP/linxisa-html-0592"
      - name: Build normative English documentation
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/site-en"
      - name: Build secondary Chinese documentation
        run: mkdocs build --strict --config-file mkdocs.zh.yml --site-dir "${RUNNER_TEMP}/site-zh"
      - name: Render the ISA manual strictly
        run: bundle exec asciidoctor --failure-level WARN -o "${RUNNER_TEMP}/linxisa-isa-manual.html" src/linxisa-isa-manual.adoc
        working-directory: docs/architecture/isa-manual

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install python lint deps
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (hard errors only)
        run: ruff check --config ruff.toml --force-exclude .
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        shell: bash
        run: |
          shopt -s nullglob
          mapfile -t files < <(git ls-files '*.sh')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck -x -S error "${files[@]}"

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Init tools/model submodule
        run: |
          git submodule sync -- tools/model
          git submodule update --init tools/model
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure tools/model
        run: cmake -S tools/model -B tools/model/build-ci -G Ninja
      - name: Build tools/model
        run: cmake --build tools/model/build-ci
      - name: Run tools/model tests
        run: ctest --test-dir tools/model/build-ci --output-on-failure

  guard:
    needs: [guards, avs-contract, docs, lint, model]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required release checks
        run: echo "All required LinxISA release checks passed."
