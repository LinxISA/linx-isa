name: Spec clarification
description: Request clarification or report an ambiguity in the ISA spec/contract.
title: "[Spec] "
labels: ["spec"]
body:
  - type: input
    id: location
    attributes:
      label: Spec location
      description: Link to the v0.58 machine-readable clause or current generated/reference page (e.g. `isa/v0.58/linxisa-v0.58.json`).
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question / ambiguity
      description: What is unclear or inconsistent?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed resolution (optional)
      description: If you have a suggested wording or rule, include it.
    validations:
      required: false
