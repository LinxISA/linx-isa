site_name: LinxISA
site_description: Normative LinxISA architecture and instruction-set documentation
site_url: https://linxisa.github.io/
repo_url: https://github.com/LinxISA/linx-isa
repo_name: LinxISA/linx-isa
edit_uri: edit/main/docs/
docs_dir: docs

exclude_docs: |
  /README.md
  archive/**
  zh/**
  architecture/isa-manual/.bundle/**
  architecture/isa-manual/build/**
  architecture/isa-manual/vendor/**

theme:
  name: material
  language: en

plugins:
  - search

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Architecture:
      - Architecture documentation: architecture/README.md
      - v0.56 architecture contract: architecture/v0.56-architecture-contract.md
      - Workload-engine model: architecture/v0.56-workload-engine-model.md
      - Rendering command contract: architecture/v0.56-rendering-command-contract.md
      - LinxCore:
          - Overview: architecture/linxcore/overview.md
          - Microarchitecture: architecture/linxcore/microarchitecture.md
          - Interfaces: architecture/linxcore/interfaces.md
          - Verification matrix: architecture/linxcore/verification-matrix.md
          - Module catalog: architecture/linxcore/module-catalog.md
          - Pipeline stages: architecture/linxcore/pipeline-stage-catalog.md
  - ISA Reference:
      - Instruction reference: isa/index.md
      - Encoding formats: isa/encoding.md
      - Instruction groups: isa/groups/index.md
      - All instructions: isa/instructions/index.md
      - Full ISA manual: architecture/isa-manual/README.md
  - Programming:
      - Assembly guide: reference/linxisa-assembly-agent-guide.md
      - Call/return contract: reference/linxisa-call-ret-contract.md
      - Examples: reference/examples/v0.56/README.md
  - Bring-up:
      - Getting started: bringup/GETTING_STARTED.md
      - Canonical flow: bringup/BENCHMARK_QEMU_LINUX_FLOW.md
      - Current progress: bringup/PROGRESS.md
      - Gate status: bringup/GATE_STATUS.md
  - Project:
      - Navigation contract: project/navigation.md
      - v0.56.5 release notes: releases/v0.56.5.md
